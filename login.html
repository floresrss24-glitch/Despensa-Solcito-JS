<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Despensa Solcito</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <main class="login-container">

        <a href="index.html" class="volver-inicio">
            <i class="fa-solid fa-arrow-left"></i> Volver al inicio
        </a>

        <div class="login-card">

            <div class="logo">
                <div class="logo-icono">
                    <i class="fa-solid fa-sun"></i>
                </div>
                <h1>Despensa <span>Solcito</span></h1>
                <p>¡Qué bueno verte de nuevo!</p>
            </div>

            <div class="login-titulo">
                <h2>Iniciar sesión</h2>
                <p>Ingresá tus datos para continuar.</p>
            </div>

            <form id="formLogin" novalidate>

                <div class="campo">
                    <label for="correo">Correo electrónico:</label>
                    <div class="input-icono">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="correo" name="correo" autocomplete="email" placeholder="ejemplo@correo.com">
                    </div>
                    <p class="error-campo" id="errorCorreo" role="alert"></p>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña:</label>
                    <div class="input-icono">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" placeholder="Tu contraseña">
                        <button type="button" id="mostrarContrasena" class="mostrar-contrasena" aria-label="Mostrar contraseña">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <p class="error-campo" id="errorContrasena" role="alert"></p>
                </div>

                <button type="submit" class="boton-login">Ingresar</button>

                <p class="mensaje" id="mensajeLogin" role="status" aria-live="polite"></p>

            </form>

            <div class="separador">
                <span>¿Todavía no tenés una cuenta?</span>
            </div>

            <a href="registro.html" class="boton-registro">
                Crear una cuenta
            </a>

        </div>

        <p class="pie-login">
            © 2026 Despensa Solcito. Todos los derechos reservados.
        </p>

    </main>

    <script src="js/funciones/tema.js"></script>
    <script src="js/paginas/login.js"></script>
</body>
</html>
