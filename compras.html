<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras - Despensa Solcito</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/compras.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header class="top-header">
    <div class="logo">
        <div class="logo-icon">
            <i class="fas fa-sun"></i>
        </div>
        <h1>Despensa Solcito</h1>
    </div>
</header>

<nav class="navbar">
    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="producto.html">Productos</a></li>
        <li><a href="promociones.html">Promociones</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="sobre_nosotros.html">Sobre nosotros</a></li>
        <li><a href="contactos.html">Contactos</a></li>
        <li><a href="compras.html">Compras</a></li>
    </ul>
</nav>

<main class="compras">

    <section class="compras-header">
        <h2>Realizar compra</h2>
        <p>Completá los datos para realizar tu pedido.</p>
    </section>

    <section class="pedido-card">

        <form id="formPedido" action="#" method="post" enctype="multipart/form-data" data-validar data-resumen="resumenPedido">

            <input type="hidden" id="origen" name="origen" value="despensa">

            <fieldset>
                <legend>Detalle del pedido</legend>

                <div class="form-group">
                    <label for="categoria">Categoría de producto *</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">-- Seleccioná una categoría --</option>
                        <option value="bebidas">Bebidas</option>
                        <option value="panaderia">Panadería</option>
                        <option value="abarrotes">Abarrotes</option>
                        <option value="snacks">Snacks</option>
                        <option value="lacteos">Lácteos</option>
                        <option value="pastas">Pastas</option>
                        <option value="limpieza">Limpieza</option>
                        <option value="congelados">Congelados</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cantidad">Cantidad *</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" max="50" value="1" required>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha de entrega deseada</label>
                    <input type="date" id="fecha" name="fecha">
                </div>

                <div class="form-group">
                    <span class="form-label">Tipo de entrega *</span>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="entrega" value="domicilio" required>
                            Envío a domicilio
                        </label>

                        <label>
                            <input type="radio" name="entrega" value="retiro">
                            Retiro en tienda
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comprobante">Adjuntar comprobante de pago <span>(opcional)</span></label>
                    <input type="file" id="comprobante" name="comprobante" accept=".jpg,.jpeg,.png,.pdf">
                </div>
            </fieldset>

            <div class="form-group">
                <label for="comentarios">Comentarios adicionales</label>
                <textarea id="comentarios" name="comentarios" rows="5" maxlength="500" placeholder="Indicá cualquier preferencia o consulta especial..."></textarea>
                <small id="contadorComentarios">Máximo 500 caracteres.</small>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
                <label for="terminos">Acepto los términos y condiciones de Despensa Solcito. *</label>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-enviar">Enviar consulta</button>
                <button type="reset" class="btn-reset">Borrar</button>
            </div>

        </form>
    </section>

    <section class="resumen" id="resumenPedido" aria-live="polite" hidden></section>
</main>

    <script src="js/funciones/tema.js"></script>
    <script src="js/funciones/menus.js"></script>
    <script src="js/funciones/validaciones.js"></script>
    <script src="js/funciones/resumen-formulario.js"></script>
    <script src="js/paginas/compras.js"></script>
</body>
</html>
