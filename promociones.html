<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Promociones - Despensa Solcito</title>
    <!-- CSS principal -->
    <link rel="stylesheet" href="css/style.css">
    <!-- CSS para promociones -->
    <link rel="stylesheet" href="css/promociones.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> 
</head>
<body>
    <!-- HEADER PRINCIPAL -->
    <header class="top-header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-sun"></i>
            </div>
            <h1>Despensa Solcito</h1>
        </div>
    </header>

    <!-- MENÚ -->
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="producto.html">Productos</a></li>
            <li><a href="promociones.html">Promociones</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="sobre_nosotros.html">Sobre nosotros</a></li>
            <li><a href="contactos.html">Contactos</a></li>
            <li><a href="compras.html">Compras</a></li>
        </ul>
    </nav>

    <!-- PROMOCIONES -->
    <section class="promo-container">

        <div class="promo-header">
            <h2>PROMOCIONES</h2>

            <img src="img/fotos/promocion.jpg" alt="Imagen representativa de las promociones de Despensa Solcito">
        </div>

        <!-- PROMO 1 -->
        <div class="promo-card">
            <div class="promo-badge">
                10%
            </div>

            <div class="promo-info">
                <h3>EN GASEOSAS</h3>
                <p>Por comprar desde $10.000</p>
            </div>

            <a href="#" class="promo-btn">
                VER MÁS
            </a>
        </div>

        <!-- PROMO 2 -->
        <div class="promo-card">

            <div class="promo-badge">
                2×1
            </div>

            <div class="promo-info">
                <h3>EN GOLOSINAS</h3>
                <p>Lleva 2 y paga 1</p>
            </div>

            <a href="producto.html" class="promo-btn">
                Ver más sobre la promoción de gaseosas
            </a>
        </div>
    </section>

    <script src="js/funciones/tema.js"></script>
    <script src="js/funciones/menus.js"></script>
