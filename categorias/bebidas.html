<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despensa Solcito</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- HEADER PRINCIPAL -->
    <header class="top-header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-sun"></i>
            </div>
            <h1>Despensa Solcito</h1>
        </div>

    <!-- MENÚ -->
    <nav class="navbar">
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="../producto.html">Productos</a></li>
            <li><a href="../promociones.html">Promociones</a></li>

    <section class="categorias">
        <h2>Bebidas</h2>

    <section class="categorias" data-galeria>
        <div class="grid-categorias">

            <div class="card">
                <div class="images bebida">
                    <img src="../img/productos/coca-cola.png" alt="Coca-Cola">
                </div>
                <h3>Coca Cola</h3>
                <span>$25.00</span>

            <div class="card">
                <div class="images pan">
                    <img src="../img/productos/pepsi.png" alt="Pepsi">
                </div>
                <h3>Pepsi</h3>
                <span>$15.00</span>
            </div>
        </div>
